# ACP Reference Server — docker-compose for local development
#
# Usage:
#   1. Copy .env.example to .env and fill ACP_INSTITUTION_PUBLIC_KEY
#   2. docker compose up
#
# The institution public key is the base64url-encoded Ed25519 public key
# of the institution that issues capability tokens.
#
# To generate a test key with the Python SDK:
#   PYTHONPATH=../sdk/python python -c "
#   from acp.identity import AgentIdentity
#   import base64
#   a = AgentIdentity.generate()
#   print(base64.urlsafe_b64encode(a.public_key_bytes).rstrip(b'=').decode())
#   "
#
# For the RFC 8037 test key A (seed 9d61b19d...):
#   ACP_INSTITUTION_PUBLIC_KEY=cA4s58S2dEJ-qye6EpJaJKKaVfvPT8mAQf97Vo8TInk
#
# Endpoints:
#   GET  http://localhost:${ACP_PORT:-8080}/acp/v1/challenge   — issue challenge nonce
#   POST http://localhost:${ACP_PORT:-8080}/acp/v1/verify       — verify CT + PoP
#   POST http://localhost:${ACP_PORT:-8080}/acp/v1/register     — register agent pubkey
#   GET  http://localhost:${ACP_PORT:-8080}/acp/v1/health       — health check

services:
  acp-server:
    image: ghcr.io/chelof100/acp-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acp-server
    ports:
      - "${ACP_PORT:-8080}:8080"
    environment:
      ACP_INSTITUTION_PUBLIC_KEY: "${ACP_INSTITUTION_PUBLIC_KEY:?ACP_INSTITUTION_PUBLIC_KEY is required}"
      ACP_ADDR: ":8080"
      ACP_LOG_LEVEL: "${ACP_LOG_LEVEL:-info}"
    restart: unless-stopped
    healthcheck:
      # distroless has no shell — invoke the binary directly
      test: ["/acp-server", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "acp.version=1.0.0"
      - "acp.spec=ACP-CT-1.0,ACP-HP-1.0,ACP-SIGN-1.0"

  # ── Optional: Prometheus metrics scraping ──────────────────────────────────
  # Uncomment if you add /metrics endpoint.
