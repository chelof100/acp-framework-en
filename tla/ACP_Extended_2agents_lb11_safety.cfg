\* TLC configuration for ACP_Extended.tla — 2-agent, LEDGER_BOUND=11, safety only
\* Run: java -Xmx24g -jar tla2tools.jar -deadlock -workers 14 -config ACP_Extended_2agents_lb11_safety.cfg ACP_Extended.tla
\*
\* Purpose: verify that all 11 safety invariants hold for 2 agents at the correct
\* ledger bound required for liveness (LEDGER_BOUND >= FLOOD_THRESHOLD x |Agents| + delta).
\*
\* Key differences from ACP_Extended_2agents_liveness.cfg:
\*   - LEDGER_BOUND = 11  (correct bound: FLOOD_THRESHOLD x 2 + 3 = 4x2+3 = 11)
\*   - No PROPERTIES section (safety only — liveness excluded to keep state space tractable)
\*   - Workers = 14, Heap = 24g (calibrated for Dell G15 i9-13900HX + 32 GB RAM)
\*
\* Rationale for LEDGER_BOUND=11:
\*   With 2 agents sharing a ledger, both agents must be able to accumulate
\*   FLOOD_THRESHOLD=4 requests each before the ledger fills. Minimum safe bound:
\*   LEDGER_BOUND >= FLOOD_THRESHOLD x |Agents| + buffer = 4x2+3 = 11.
\*   Previous run (LEDGER_BOUND=6) produced exploration collapse: ledger filled
\*   before flood threshold was reachable, making liveness verification vacuous.
\*
\* Machine requirements (Dell G15):
\*   - Java 21 LTS (Temurin)
\*   - 32 GB RAM -> heap set to 24g (leaves ~8g for OS + TLC overhead)
\*   - i9-13900HX (24 cores) -> 14 workers (leaves headroom for system)
\*
\* Expected results:
\*   - State space: 100M-500M states estimated (vs 27.6M distinct at LEDGER_BOUND=6)
\*   - Duration: 12-72 hours estimated
\*   - Safety invariants (11): expect 0 violations
\*   - Liveness: not checked in this run (see ACP_Extended_2agents_lb11_liveness.cfg for follow-up)
\*
\* Output: redirect stdout+stderr to tlc_lb11_safety.log (see run instructions)

SPECIFICATION
    Spec

CONSTANTS
    Agents           = {"A1", "A2"}
    Capabilities     = {"read", "financial", "admin"}
    Resources        = {"public", "sensitive"}
    COOLDOWN_TRIGGER = 3
    COOLDOWN_WINDOW  = 3
    MAX_TIME         = 7
    FLOOD_THRESHOLD  = 4
    FANOM_BONUS      = 25
    LEDGER_BOUND     = 11

\* Full safety invariants (same as single-agent and previous 2-agent runs)
INVARIANTS
    TypeInvariant
    Safety
    LedgerAppendOnly
    RiskDeterminism
    CooldownEnforced
    CooldownImpliesThreshold
    DelegationIntegrity
    AnomalyDeterminism
    FloodEnforced
    FailureConditionPreservation
    NoDegenerateAdmissibility

\* PROPERTIES intentionally excluded — safety-only run.
\* Liveness with LEDGER_BOUND=11 requires further hardware validation.
\* See future_work_tlc_multiagent.md for Opcion A (full liveness run).
