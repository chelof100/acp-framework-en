\* TLC configuration for ACP_Extended.tla — 2-agent with full liveness verification
\* Run: java -Xmx12g -jar tla2tools.jar -deadlock -workers 6 -config ACP_Extended_2agents_liveness.cfg ACP_Extended.tla
\*
\* Purpose: verify that per-agent enforcement AND liveness properties hold under
\* multi-agent interaction at bounds calibrated for liveness (same as single-agent run).
\*
\* Key additions over ACP_Extended_2agents.cfg:
\*   - FLOOD_THRESHOLD = 4 (sufficient for EventuallyRejected to fire within MAX_TIME=7)
\*   - MAX_TIME        = 7 (same as single-agent; required for CooldownExpires + EventuallyRejected)
\*   - LEDGER_BOUND    = 6 (conservative: one step above 2-agent safety run, below single-agent)
\*   - Full temporal liveness properties included
\*   - FailureConditionPreservation + NoDegenerateAdmissibility (v1.25 invariants)
\*
\* Rationale for LEDGER_BOUND=6:
\*   With 2 agents x 3 capabilities x 2 resources = 12 distinct request types per agent,
\*   the state space grows substantially vs single-agent. LEDGER_BOUND=6 > FLOOD_THRESHOLD=4
\*   ensures flood activation fires within the bounded space, while keeping state space
\*   tractable for multi-core exploration over hours.
\*
\* Expected result: 11 safety invariants + 4 temporal properties, 0 violations.
\* State space estimate: 20M-80M states (vs 5,684,342 single-agent, 3,011,690 2-agent safety).

SPECIFICATION
    Spec

CONSTANTS
    Agents           = {"A1", "A2"}
    Capabilities     = {"read", "financial", "admin"}
    Resources        = {"public", "sensitive"}
    COOLDOWN_TRIGGER = 3
    COOLDOWN_WINDOW  = 3
    MAX_TIME         = 7
    FLOOD_THRESHOLD  = 4
    FANOM_BONUS      = 25
    LEDGER_BOUND     = 6

\* Full safety invariants (same as single-agent run)
INVARIANTS
    TypeInvariant
    Safety
    LedgerAppendOnly
    RiskDeterminism
    CooldownEnforced
    CooldownImpliesThreshold
    DelegationIntegrity
    AnomalyDeterminism
    FloodEnforced
    FailureConditionPreservation
    NoDegenerateAdmissibility

\* Full temporal liveness properties (calibrated for FLOOD_THRESHOLD=4, MAX_TIME=7)
\* These hold for \A a \in Agents, so they verify jointly over both A1 and A2.
PROPERTIES
    LedgerAppendOnlyTemporal
    CooldownExpires
    EventuallyRejected
    NoInfiniteExecutionUnderAbuse
